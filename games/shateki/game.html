<title>縁日の射的屋</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* Layout: full-bleed 3D stall seen from the counter; HUD floats on top, the prize list docks at the bottom. Single dark summer-night look by choice. */
:root {
  --night: #141a33;
  --lantern: #e4483a;
  --paper: #f3ecdc;
  --muted: #a3a9c8;
  --gold: #f2b43c;
  --font-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--night); color: var(--paper); font-family: var(--font-body); font-size: 15px; overflow: hidden; }
.stage { position: relative; height: 100%; min-height: 440px; }
#gl { position: absolute; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; cursor: none; }
.hud {
  position: absolute; left: 0; right: 0; top: 0;
  padding: 14px 16px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
  pointer-events: none; font-variant-numeric: tabular-nums;
  background: linear-gradient(rgba(13,18,40,.75), rgba(13,18,40,0));
}
.hud h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(18px, 4.5vw, 26px); letter-spacing: .04em; line-height: 1.1; }
.hud h1 small { display: block; font-family: var(--font-body); font-size: 11px; letter-spacing: .2em; color: var(--muted); font-weight: 700; }
.stats { display: flex; gap: 16px; align-items: flex-start; }
.stat { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
.stat b { font-size: 11px; letter-spacing: .14em; color: var(--muted); }
.stat output { font-family: var(--font-display); font-size: 24px; line-height: 1; }
.corks { display: grid; grid-template-columns: repeat(5, 9px); gap: 4px 4px; }
.corks i { width: 9px; height: 11px; border-radius: 3px 3px 2px 2px; background: #d6a86a; box-shadow: inset 0 -3px 0 #a87a44; }
.corks i.used { background: #3a4068; box-shadow: none; }
.reticle { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; pointer-events: none; left: 50%; top: 50%; }
.reticle::before, .reticle::after { content: ""; position: absolute; background: var(--paper); box-shadow: 0 0 0 1px rgba(13,18,40,.6); }
.reticle::before { left: 21px; top: 0; width: 2px; height: 44px; }
.reticle::after { top: 21px; left: 0; height: 2px; width: 44px; }
.reticle span { position: absolute; inset: 9px; border: 2px solid var(--paper); border-radius: 50%; box-shadow: 0 0 0 1px rgba(13,18,40,.6); }
.toast {
  position: absolute; pointer-events: none; transform: translate(-50%, -100%);
  font-family: var(--font-display); font-size: 22px; white-space: nowrap;
  text-shadow: 0 2px 0 rgba(13,18,40,.8), 0 0 8px rgba(13,18,40,.8);
  animation: rise 1.1s ease-out forwards;
}
.toast.win { color: var(--gold); }
@keyframes rise { from { opacity: 1; margin-top: 0; } to { opacity: 0; margin-top: -40px; } }
.shelf-log {
  position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 16px calc(12px + env(safe-area-inset-bottom, 0px));
  display: flex; gap: 8px; flex-wrap: wrap; align-items: center; pointer-events: none;
  background: linear-gradient(rgba(13,18,40,0), rgba(13,18,40,.8));
  font-size: 12.5px; color: var(--muted); min-height: 22px;
}
.shelf-log span { background: rgba(243,236,220,.12); color: var(--paper); border-radius: 999px; padding: 3px 10px; }
.overlay { position: absolute; inset: 0; display: grid; place-items: center; padding: 20px 16px; background: rgba(13,18,40,.66); text-align: center; overflow-y: auto; }
.card { max-width: 440px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.card h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(24px, 6vw, 34px); line-height: 1.25; text-wrap: balance; }
.card p { margin: 0; line-height: 1.75; }
.rules { color: var(--muted); font-size: 13.5px; text-align: left; }
.price { display: grid; grid-template-columns: 1fr auto; gap: 2px 16px; font-size: 13px; text-align: left; width: 100%; max-width: 300px; font-variant-numeric: tabular-nums; }
.price span:nth-child(2n) { color: var(--gold); text-align: right; }
.big { font-family: var(--font-display); font-size: 54px; line-height: 1; color: var(--gold); font-variant-numeric: tabular-nums; }
button {
  font-family: var(--font-display); font-size: 18px; letter-spacing: .08em;
  color: var(--paper); background: var(--lantern); border: 0; border-radius: 999px;
  padding: 12px 34px; cursor: pointer; box-shadow: 0 6px 0 #8f2219;
}
button:active { transform: translateY(3px); box-shadow: 0 3px 0 #8f2219; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.err { color: var(--muted); }
</style>

<div class="stage" id="stage">
  <canvas id="gl" aria-label="射的屋の棚。狙って撃つと景品を落とせる"></canvas>
  <div class="reticle" id="reticle" aria-hidden="true"><span></span></div>
  <div class="hud">
    <h1><small>コルク十発・五百円</small>射的</h1>
    <div class="stats">
      <div class="stat"><b>コルク</b><div class="corks" id="corks"></div></div>
      <div class="stat"><b>点数</b><output id="score">0</output></div>
      <div class="stat"><b>最高</b><output id="best">0</output></div>
    </div>
  </div>
  <div class="shelf-log" id="log">落とした景品はここに並びます</div>
  <div id="toasts"></div>
  <div class="overlay" id="startScreen">
    <div class="card">
      <h2>棚から落とせば、<br>景品はあなたのもの。</h2>
      <div class="rules">
        <p>・狙いを合わせて撃つ。銃は少しぶれます。</p>
        <p>・軽くて背の高い景品は、上の方を撃つと倒れやすい。</p>
        <p>・重い景品は当てるたびに少しずつ奥へずれます。何発も当てて棚から押し出そう。</p>
        <p>・パソコンはマウスで狙ってクリック。スマホは指でなぞって、離すと発射。</p>
      </div>
      <div class="price" id="priceList"></div>
      <button id="startBtn" type="button">コルクを受け取る</button>
    </div>
  </div>
  <div class="overlay" id="endScreen" hidden>
    <div class="card">
      <p id="endLabel">コルク切れ</p>
      <div class="big" id="finalScore">0</div>
      <h2 id="endTitle">また来てね</h2>
      <p id="endNote"></p>
      <button id="againBtn" type="button">もう一回</button>
    </div>
  </div>
  <div class="overlay" id="noGl" hidden>
    <div class="card"><h2>3D 表示を開けませんでした</h2><p class="err">このブラウザでは WebGL が使えないようです。別のブラウザか端末で開いてください。</p></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const fail = () => { $("startScreen").hidden = true; $("noGl").hidden = false; };
  if (!window.THREE) { fail(); return; }
  let renderer;
  try { renderer = new THREE.WebGLRenderer({ canvas: $("gl"), antialias: true }); } catch (e) { fail(); return; }

  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const CORKS = 10;

  // m = weight, d = footprint depth; tipping needs hitHeight > m*d, pushing moves it back by PUSH/m per hit
  const KINDS = {
    caramel: { name: "キャラメル",   pts: 10,  m: .5,  d: .14, H: .30 },
    ramune:  { name: "ラムネ",       pts: 20,  m: 1.0, d: .16, H: .48 },
    kokeshi: { name: "こけし",       pts: 30,  m: 1.4, d: .17, H: .62 },
    daruma:  { name: "だるま",       pts: 50,  m: 2.2, d: .40, H: .46 },
    neko:    { name: "招き猫",       pts: 80,  m: 2.8, d: .36, H: .58 },
    console: { name: "ゲーム機の箱", pts: 150, m: 4.5, d: .55, H: .72 },
  };
  const PUSH = .038;

  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x141a33);
  scene.fog = new THREE.Fog(0x141a33, 14, 30);
  const camera = new THREE.PerspectiveCamera(50, 1, .05, 60);
  camera.position.set(0, 1.75, 6.2);
  const LOOK = new THREE.Vector3(0, 1.55, 0);
  camera.lookAt(LOOK);
  scene.add(camera);

  scene.add(new THREE.HemisphereLight(0xffe2c0, 0x2a2030, .55));
  const spot = new THREE.SpotLight(0xfff0d8, 1.25, 20, .7, .5, 1);
  spot.position.set(0, 5.2, 3.2); spot.target.position.set(0, 1.3, -.6);
  spot.castShadow = true; spot.shadow.mapSize.set(1024, 1024);
  scene.add(spot, spot.target);
  const fill = new THREE.PointLight(0xff9a60, .6, 12); fill.position.set(-3, 3, 2); scene.add(fill);

  function canvasTex(w, h, paint) {
    const c = document.createElement("canvas"); c.width = w; c.height = h;
    paint(c.getContext("2d"), w, h);
    const t = new THREE.CanvasTexture(c); t.anisotropy = 4; return t;
  }
  const std = (o) => new THREE.MeshStandardMaterial(Object.assign({ roughness: .6 }, o));

  // ---------- stall ----------
  const kohaku = canvasTex(256, 64, (g, w, h) => { for (let i = 0; i < 8; i++) { g.fillStyle = i % 2 ? "#f3ecdc" : "#d8402c"; g.fillRect(i * 32, 0, 32, h); } });
  kohaku.wrapS = THREE.RepeatWrapping; kohaku.repeat.set(4, 1);
  const curtain = new THREE.Mesh(new THREE.PlaneGeometry(9, 4.2), std({ map: kohaku, roughness: .95 }));
  curtain.position.set(0, 2.1, -2.2); curtain.receiveShadow = true; scene.add(curtain);
  const felt = std({ color: 0x8e1d1d, roughness: 1 });
  const wood = std({ color: 0x6b4226, roughness: .8 });
  const TIERS = [{ y: .85, front: .2, back: -.35 }, { y: 1.45, front: -.45, back: -1.0 }, { y: 2.05, front: -1.1, back: -1.65 }];
  TIERS.forEach(t => {
    const depth = t.front - t.back;
    const top = new THREE.Mesh(new THREE.BoxGeometry(6.4, .06, depth), felt);
    top.position.set(0, t.y - .03, (t.front + t.back) / 2); top.receiveShadow = true; scene.add(top);
    const riser = new THREE.Mesh(new THREE.BoxGeometry(6.4, t.y, .05), felt);
    riser.position.set(0, t.y / 2, t.front + .025); scene.add(riser);
  });
  const counter = new THREE.Mesh(new THREE.BoxGeometry(7.6, .12, .9), wood);
  counter.position.set(0, 1.0, 2.6); counter.receiveShadow = true; scene.add(counter);
  const counterFront = new THREE.Mesh(new THREE.BoxGeometry(7.6, 1.0, .08), std({ color: 0x4a2c1a }));
  counterFront.position.set(0, .5, 3.05); scene.add(counterFront);
  [-3.7, 3.7].forEach(x => { const p = new THREE.Mesh(new THREE.BoxGeometry(.18, 4.4, .18), wood); p.position.set(x, 2.2, 2.4); scene.add(p); });
  const signTex = canvasTex(512, 96, (g, w, h) => {
    g.fillStyle = "#f3ecdc"; g.fillRect(0, 0, w, h);
    g.fillStyle = "#1a1214"; g.font = "bold 64px serif"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText("射　的", w / 2, h / 2 + 4);
  });
  const sign = new THREE.Mesh(new THREE.BoxGeometry(3.2, .6, .08), [wood, wood, wood, wood, std({ map: signTex }), wood]);
  sign.position.set(0, 4.05, 2.4); scene.add(sign);
  const lanternTex = canvasTex(128, 128, (g, w, h) => {
    const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, "#ffb07a"); gr.addColorStop(.5, "#ff5a3c"); gr.addColorStop(1, "#ffb07a");
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    g.strokeStyle = "rgba(120,20,10,.35)"; for (let y = 8; y < h; y += 12) { g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }
  });
  const lanternMat = std({ map: lanternTex, emissive: 0xff5a3c, emissiveMap: lanternTex, emissiveIntensity: .9 });
  const lanterns = [];
  for (let i = 0; i < 7; i++) {
    const l = new THREE.Mesh(new THREE.SphereGeometry(.22, 14, 10), lanternMat);
    l.scale.y = 1.3; l.position.set(-3 + i, 3.55, 2.3); scene.add(l); lanterns.push(l);
  }
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), std({ color: 0x1e2038, roughness: 1 }));
  floor.rotation.x = -Math.PI / 2; scene.add(floor);

  // ---------- prizes ----------
  const labelTex = (bg, fg, text, size) => canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = bg; g.fillRect(0, 0, w, h);
    g.fillStyle = fg; g.font = `bold ${size}px sans-serif`; g.textAlign = "center"; g.textBaseline = "middle";
    text.split("\n").forEach((line, i, a) => g.fillText(line, w / 2, h / 2 + (i - (a.length - 1) / 2) * size * 1.1));
  });
  const T = {
    caramel: labelTex("#f2c230", "#7a2a10", "キャラ\nメル", 64),
    console: canvasTex(256, 256, (g, w, h) => {
      g.fillStyle = "#1d2547"; g.fillRect(0, 0, w, h);
      g.fillStyle = "#e4483a"; g.fillRect(0, 0, w, 54);
      g.fillStyle = "#f3ecdc"; g.font = "bold 40px sans-serif"; g.textAlign = "center"; g.fillText("ゲーム機", w / 2, 40);
      g.fillStyle = "#3a4a8a"; g.fillRect(40, 90, 176, 100);
      g.fillStyle = "#f2b43c"; g.font = "bold 30px sans-serif"; g.fillText("特賞", w / 2, 230);
    }),
  };
  const BUILD = {
    caramel(k) { const g = new THREE.Group(); const box = new THREE.Mesh(new THREE.BoxGeometry(.2, k.H, k.d), std({ map: T.caramel })); box.position.y = k.H / 2; g.add(box); return g; },
    ramune(k) {
      const g = new THREE.Group(), glass = std({ color: 0x6fc4e8, transparent: true, opacity: .75, roughness: .1 });
      const body = new THREE.Mesh(new THREE.CylinderGeometry(.08, .08, k.H * .6, 16), glass); body.position.y = k.H * .3; g.add(body);
      const neck = new THREE.Mesh(new THREE.CylinderGeometry(.045, .08, k.H * .3, 16), glass); neck.position.y = k.H * .75; g.add(neck);
      const ball = new THREE.Mesh(new THREE.SphereGeometry(.035, 10, 8), std({ color: 0x9ad8ff, roughness: .05 })); ball.position.y = k.H * .74; g.add(ball);
      const cap = new THREE.Mesh(new THREE.CylinderGeometry(.048, .048, k.H * .1, 12), std({ color: 0x2c74b8 })); cap.position.y = k.H * .95; g.add(cap);
      return g;
    },
    kokeshi(k) {
      const g = new THREE.Group();
      const body = new THREE.Mesh(new THREE.CylinderGeometry(.07, .085, k.H * .62, 16), std({ map: canvasTex(64, 128, (c, w, h) => { c.fillStyle = "#e9c99a"; c.fillRect(0, 0, w, h); c.fillStyle = "#c0389a"; for (let y = 10; y < h; y += 30) { c.beginPath(); c.arc(w / 2, y + 8, 9, 0, 7); c.fill(); } c.fillStyle = "#3aa37a"; c.fillRect(0, h - 10, w, 10); }) }));
      body.position.y = k.H * .31; g.add(body);
      const head = new THREE.Mesh(new THREE.SphereGeometry(.1, 16, 12), std({ color: 0xf2dcc0 })); head.position.y = k.H * .78; g.add(head);
      const hair = new THREE.Mesh(new THREE.SphereGeometry(.104, 16, 12, 0, Math.PI * 2, 0, Math.PI * .5), std({ color: 0x15151a })); hair.position.y = k.H * .79; hair.rotation.x = -.35; g.add(hair);
      return g;
    },
    daruma(k) {
      const g = new THREE.Group();
      const body = new THREE.Mesh(new THREE.SphereGeometry(k.d / 2, 24, 18), std({ color: 0xd8302a, roughness: .35 })); body.scale.y = 1.15; body.position.y = k.H / 2; g.add(body);
      const face = new THREE.Mesh(new THREE.CircleGeometry(.11, 20), std({ map: canvasTex(128, 128, (c, w, h) => { c.fillStyle = "#f3ecdc"; c.fillRect(0, 0, w, h); c.fillStyle = "#15151a"; c.beginPath(); c.arc(40, 60, 13, 0, 7); c.fill(); c.lineWidth = 7; c.strokeStyle = "#15151a"; c.beginPath(); c.arc(88, 60, 13, 0, 7); c.stroke(); c.beginPath(); c.moveTo(30, 34); c.quadraticCurveTo(64, 20, 98, 34); c.stroke(); }) }));
      face.position.set(0, k.H * .58, k.d / 2 - .015); g.add(face);
      return g;
    },
    neko(k) {
      const g = new THREE.Group(), white = std({ color: 0xf6f1e6, roughness: .3 }), red = std({ color: 0xd8302a });
      const body = new THREE.Mesh(new THREE.SphereGeometry(.17, 20, 16), white); body.scale.set(1, 1.1, .95); body.position.y = .19; g.add(body);
      const head = new THREE.Mesh(new THREE.SphereGeometry(.14, 20, 16), white); head.position.y = .44; g.add(head);
      [-1, 1].forEach(s => { const e = new THREE.Mesh(new THREE.ConeGeometry(.05, .09, 8), white); e.position.set(s * .08, .57, 0); e.rotation.z = -s * .3; g.add(e); });
      const paw = new THREE.Mesh(new THREE.SphereGeometry(.055, 10, 8), white); paw.position.set(.15, .5, .05); g.add(paw);
      const collar = new THREE.Mesh(new THREE.TorusGeometry(.12, .02, 6, 20), red); collar.rotation.x = Math.PI / 2; collar.position.y = .33; g.add(collar);
      const bell = new THREE.Mesh(new THREE.SphereGeometry(.035, 10, 8), std({ color: 0xf2b43c, metalness: .7, roughness: .3 })); bell.position.set(0, .3, .12); g.add(bell);
      const koban = new THREE.Mesh(new THREE.CylinderGeometry(.06, .06, .015, 16), std({ color: 0xf2b43c, metalness: .7, roughness: .3 })); koban.rotation.x = Math.PI / 2; koban.scale.z = 1.4; koban.position.set(-.08, .2, .16); g.add(koban);
      return g;
    },
    console(k) { const g = new THREE.Group(); const side = std({ color: 0x1d2547 }); const box = new THREE.Mesh(new THREE.BoxGeometry(.55, k.H, k.d), [side, side, side, side, std({ map: T.console }), side]); box.position.y = k.H / 2; g.add(box); return g; },
  };

  // tier → kinds left to right
  const LAYOUT = [
    ["caramel", "ramune", "daruma", "caramel", "ramune", "kokeshi"],
    ["kokeshi", "neko", "caramel", "ramune", "daruma"],
    ["ramune", "daruma", "console", "neko"],
  ];
  let prizes = [];
  const hitMeshes = [];

  function buildPrizes() {
    prizes.forEach(p => scene.remove(p.pivot)); prizes = []; hitMeshes.length = 0;
    LAYOUT.forEach((row, ti) => {
      const tier = TIERS[ti], span = 5.6, step = span / row.length;
      row.forEach((kid, i) => {
        const k = KINDS[kid];
        const inner = BUILD[kid](k);
        inner.position.z = k.d / 2;               // pivot sits on the back bottom edge
        inner.traverse(o => { if (o.isMesh) { o.castShadow = true; hitMeshes.push(o); o.userData.prizeIdx = prizes.length; } });
        const pivot = new THREE.Group(); pivot.add(inner);
        const margin = .03 + Math.random() * .04;
        pivot.position.set(-span / 2 + step * (i + .5) + (Math.random() - .5) * .15, tier.y, tier.back + margin);
        pivot.rotation.y = (Math.random() - .5) * .3;
        scene.add(pivot);
        prizes.push({ k, kid, pivot, inner, tier, state: "idle", ang: 0, angV: 0, wob: 0, fallV: 0, spin: 0 });
      });
    });
  }

  // ---------- gun ----------
  const gun = new THREE.Group();
  const barrel = new THREE.Mesh(new THREE.CylinderGeometry(.025, .03, .7, 12), std({ color: 0x2a2a30, metalness: .7, roughness: .35 }));
  barrel.rotation.x = Math.PI / 2; barrel.position.z = .35; gun.add(barrel);
  const stock = new THREE.Mesh(new THREE.BoxGeometry(.07, .11, .5), std({ color: 0x8a5a32 }));
  stock.position.set(0, -.04, -.1); gun.add(stock);
  const corkTip = new THREE.Mesh(new THREE.CylinderGeometry(.022, .027, .05, 10), std({ color: 0xd6a86a }));
  corkTip.rotation.x = Math.PI / 2; corkTip.position.z = .72; gun.add(corkTip);
  // Object3D.lookAt points +z at the target, so the gun is modelled barrel-forward along +z
  const GUN_HOME = new THREE.Vector3(.34, -.38, -.75);
  gun.position.copy(GUN_HOME);
  camera.add(gun);
  let recoil = 0;

  // ---------- aiming ----------
  const aim = { x: 0, y: .1 };       // NDC
  const ray = new THREE.Raycaster();
  let swayT = 0;
  function swayed() {
    const a = reduced ? .4 : 1;
    return { x: aim.x + Math.sin(swayT * 1.3) * .018 * a + Math.sin(swayT * 3.1) * .006 * a, y: aim.y + Math.sin(swayT * 1.7 + 1) * .016 * a };
  }
  const gl = $("gl"), reticle = $("reticle");
  function setAim(e) {
    const r = gl.getBoundingClientRect();
    aim.x = ((e.clientX - r.left) / r.width) * 2 - 1;
    aim.y = -((e.clientY - r.top) / r.height) * 2 + 1;
  }
  gl.addEventListener("pointermove", setAim);
  gl.addEventListener("pointerdown", (e) => { setAim(e); gl.setPointerCapture(e.pointerId); });
  gl.addEventListener("pointerup", (e) => { setAim(e); fire(); });
  addEventListener("keydown", (e) => {
    const step = .03;
    if (e.key === "ArrowLeft") aim.x -= step; else if (e.key === "ArrowRight") aim.x += step;
    else if (e.key === "ArrowUp") aim.y += step; else if (e.key === "ArrowDown") aim.y -= step;
    else if ((e.key === " " || e.key === "Enter") && state === "play" && !e.repeat) { e.preventDefault(); fire(); return; }
    else return;
    e.preventDefault(); aim.x = Math.max(-1, Math.min(1, aim.x)); aim.y = Math.max(-1, Math.min(1, aim.y));
  });

  // ---------- game ----------
  let state = "title", corks = CORKS, score = 0, best = 0, reload = 0, won = [];
  const flying = [];
  try { best = +localStorage.getItem("shateki-best") || 0; } catch (e) {}

  function fire() {
    if (state !== "play" || reload > 0 || corks <= 0) return;
    corks--; reload = .55; recoil = 1; hud();
    const s = swayed();
    ray.setFromCamera(new THREE.Vector2(s.x, s.y), camera);
    const hits = ray.intersectObjects(hitMeshes, false).filter(h => prizes[h.object.userData.prizeIdx].state !== "gone" && prizes[h.object.userData.prizeIdx].state !== "falling");
    const start = new THREE.Vector3(); corkTip.getWorldPosition(start);
    let end, target = null;
    if (hits.length) { end = hits[0].point.clone(); target = { p: prizes[hits[0].object.userData.prizeIdx], point: end.clone() }; }
    else { end = ray.ray.at(8, new THREE.Vector3()); }
    const cork = new THREE.Mesh(new THREE.CylinderGeometry(.03, .036, .07, 10), std({ color: 0xd6a86a }));
    cork.castShadow = true; scene.add(cork);
    const dist = start.distanceTo(end);
    flying.push({ mesh: cork, start, end, t: 0, dur: Math.max(.12, dist / 22), target });
  }

  function resolveHit(p, point) {
    const k = p.k;
    const local = p.pivot.worldToLocal(point.clone());
    const h = Math.max(0, Math.min(k.H, local.y));        // hit height above the shelf
    const tipNeed = k.m * k.d;
    p.spin += (local.x > 0 ? -1 : 1) * Math.min(.12, Math.abs(local.x) * .6) / k.m;
    if (h > tipNeed) { topple(p); return "落ちた!"; }
    p.pivot.position.z -= PUSH / k.m * (.6 + h / k.H);
    p.wob = Math.min(.45, (h / tipNeed) * .45 + .08);
    if (p.pivot.position.z < p.tier.back - .005) { topple(p); return "落ちた!"; }
    return h / tipNeed > .6 ? "ぐらっ…" : "びくともしない";
  }
  function topple(p) { p.state = "toppling"; p.angV = -1.5; }

  function land(p) {
    p.state = "gone"; scene.remove(p.pivot);
    score += p.k.pts; won.push(p.k.name); hud();
    const log = $("log");
    if (won.length === 1) log.textContent = "";
    const s = document.createElement("span"); s.textContent = `${p.k.name} ${p.k.pts}点`; log.appendChild(s);
    if (prizes.every(q => q.state === "gone")) setTimeout(() => endGame(true), 500);
  }

  function toast(text, worldPos, win) {
    const v = worldPos.clone().project(camera), r = gl.getBoundingClientRect();
    const el = document.createElement("div");
    el.className = "toast" + (win ? " win" : ""); el.textContent = text;
    el.style.left = ((v.x + 1) / 2 * r.width) + "px"; el.style.top = ((1 - v.y) / 2 * r.height) + "px";
    $("toasts").appendChild(el); setTimeout(() => el.remove(), 1100);
  }

  function hud() {
    $("score").value = score; $("best").value = best;
    $("corks").innerHTML = Array.from({ length: CORKS }, (_, i) => `<i class="${i >= corks ? "used" : ""}"></i>`).join("");
  }

  const TITLES = [[0, "また来てね", "上の方を狙うと倒れやすいよ。"], [60, "なかなかの腕前", "重い景品は同じ場所に何発も当てよう。"], [150, "射的名人", "屋台のおじさんが目を見張っています。"], [300, "伝説の狙撃手", "特賞まで持っていかれて、店じまいです。"]];
  function endGame(cleared) {
    if (state === "over") return;
    state = "over";
    const isBest = score > best;
    if (isBest) { best = score; try { localStorage.setItem("shateki-best", String(best)); } catch (e) {} }
    const [, title, note] = TITLES.filter(r => score >= r[0]).pop();
    $("finalScore").textContent = score + "点";
    $("endLabel").textContent = cleared ? "全部落とした!" : isBest && score > 0 ? "自己ベスト更新!" : "コルク切れ";
    $("endTitle").textContent = title;
    $("endNote").textContent = won.length ? `持ち帰り: ${won.join("、")}。${note}` : note;
    $("endScreen").hidden = false; hud(); $("againBtn").focus();
  }

  function start() {
    corks = CORKS; score = 0; won = []; reload = 0;
    buildPrizes(); hud();
    $("log").textContent = "落とした景品はここに並びます";
    state = "play"; $("startScreen").hidden = true; $("endScreen").hidden = true;
  }
  $("startBtn").addEventListener("click", start);
  $("againBtn").addEventListener("click", start);
  $("priceList").innerHTML = Object.values(KINDS).map(k => `<span>${k.name}</span><span>${k.pts}点</span>`).join("");

  // ---------- loop ----------
  function update(dt) {
    swayT += dt;
    if (reload > 0) reload -= dt;
    const s = swayed();
    const r = gl.getBoundingClientRect();
    reticle.style.left = ((s.x + 1) / 2 * r.width) + "px";
    reticle.style.top = ((1 - s.y) / 2 * r.height) + "px";
    reticle.style.opacity = state === "play" ? (reload > 0 ? .4 : 1) : 0;

    // gun follows the aim
    ray.setFromCamera(new THREE.Vector2(s.x, s.y), camera);
    const tgt = ray.ray.at(6, new THREE.Vector3());
    recoil = Math.max(0, recoil - dt * 5);
    gun.position.copy(GUN_HOME).add(new THREE.Vector3(0, 0, recoil * .12));
    gun.lookAt(tgt);
    gun.rotateX(-recoil * .15);
    corkTip.visible = reload <= 0 && corks > 0;

    for (let i = flying.length - 1; i >= 0; i--) {
      const f = flying[i]; f.t += dt / f.dur;
      const tt = Math.min(1, f.t);
      f.mesh.position.lerpVectors(f.start, f.end, tt); f.mesh.position.y -= Math.sin(tt * Math.PI) * .04;
      f.mesh.lookAt(f.end); f.mesh.rotateX(Math.PI / 2);
      if (f.t >= 1) {
        if (f.target && f.target.p.state !== "gone" && f.target.p.state !== "falling") {
          const msg = resolveHit(f.target.p, f.target.point);
          toast(msg, f.target.point, msg === "落ちた!");
        }
        // cork drops
        f.drop = f.drop || { v: new THREE.Vector3((Math.random() - .5) * 1.2, 1, 1.5) };
        f.mesh.userData.v = f.drop.v;
        drops.push(f.mesh); flying.splice(i, 1);
      }
    }
    for (let i = drops.length - 1; i >= 0; i--) {
      const d = drops[i]; d.userData.v.y -= 9 * dt; d.position.addScaledVector(d.userData.v, dt); d.rotation.x += dt * 8;
      if (d.position.y < 0) { scene.remove(d); drops.splice(i, 1); }
    }

    for (const p of prizes) {
      if (p.state === "idle") {
        p.wob *= Math.pow(.02, dt);
        p.ang = -Math.abs(Math.sin(swayT * 14)) * p.wob;
        p.pivot.rotation.y += p.spin * dt * 6; p.spin *= Math.pow(.01, dt);
      } else if (p.state === "toppling") {
        p.angV -= dt * 9; p.ang += p.angV * dt;
        if (p.ang < -1.45) { p.state = "falling"; p.fallV = 0; }
      } else if (p.state === "falling") {
        p.fallV -= 9.8 * dt; p.pivot.position.y += p.fallV * dt; p.pivot.position.z -= dt * .8;
        p.ang = Math.max(-2.6, p.ang - dt * 3);
        if (p.pivot.position.y < p.tier.y - .8) { toast(`+${p.k.pts}`, p.pivot.getWorldPosition(new THREE.Vector3()).setY(p.tier.y + .3), true); land(p); }
      }
      p.inner.rotation.x = 0; p.pivot.children[0].parent.rotation.x = p.ang;
    }

    if (state === "play" && corks <= 0 && flying.length === 0 && !prizes.some(p => p.state === "toppling" || p.state === "falling") && reload <= 0) {
      setTimeout(() => endGame(false), 400); state = "ending";
    }
    if (!reduced) lanterns.forEach((l, i) => { l.rotation.z = Math.sin(swayT * 1.2 + i) * .06; });

    // subtle camera drift toward aim so the stall feels like a place
    camera.position.x += (aim.x * .25 - camera.position.x) * Math.min(1, dt * 2);
    camera.lookAt(LOOK);
  }
  const drops = [];

  function resize() {
    const el = $("stage"), w = el.clientWidth, h = el.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.fov = w / h < .8 ? 74 : w / h < 1.2 ? 60 : 50;
    camera.position.z = w / h < .8 ? 7.0 : 6.2;
    camera.updateProjectionMatrix();
  }
  addEventListener("resize", resize);

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    update(dt); renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  buildPrizes(); hud(); resize();
  requestAnimationFrame(frame);
})();
</script>
