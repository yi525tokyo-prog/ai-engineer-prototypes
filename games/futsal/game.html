<title>5対5 フットサル采配</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* Layout: night five-a-side cage. Scoreboard strip on top, vertical pitch fills the middle, a match-commentary ticker below.
   Setup is a sheet of 9 sliders in the three groups the stats come in. Single dark floodlit look by choice. */
:root {
  --night: #0f1a17;        /* cage at night */
  --panel: #17261f;
  --turf: #1f5a3a;
  --line: #eef0e2;
  --home: #f3f0e6;         /* white kit */
  --home-ink: #22306b;
  --away: #e8562e;         /* orange kit */
  --muted: #9fb3a8;
  --gold: #f2c230;
  --font-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--night); color: var(--line); font-family: var(--font-body); font-size: 14px; overflow: hidden; }
.app { height: 100%; display: flex; flex-direction: column; }
.board {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding-inline: 16px; padding-block: 10px; background: var(--panel);
  font-variant-numeric: tabular-nums;
}
.board h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 16px; letter-spacing: .04em; line-height: 1.1; }
.board h1 small { display: block; font-family: var(--font-body); font-size: 10.5px; color: var(--muted); letter-spacing: .16em; font-weight: 700; }
.score { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-size: 24px; }
.score .kit { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
.score .kit.h { background: var(--home); }
.score .kit.a { background: var(--away); }
.score .clock { font-size: 14px; color: var(--muted); font-family: var(--font-body); font-weight: 700; min-width: 3.2em; text-align: right; }
.field { position: relative; flex: 1; min-height: 0; }
#pitch { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.ticker {
  padding-inline: 16px; padding-block: 8px 10px; background: var(--panel);
  display: flex; flex-direction: column; gap: 2px; min-height: 58px; font-size: 12.5px;
}
.ticker div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
.ticker div:first-child { color: var(--line); }
.ticker .h::before, .ticker .a::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.ticker .h::before { background: var(--home); }
.ticker .a::before { background: var(--away); }
.keys { position: absolute; right: 12px; bottom: 10px; font-size: 11px; color: var(--muted); text-align: right; line-height: 1.6; pointer-events: none; }
.pad { position: absolute; right: 12px; bottom: 14px; display: grid; grid-template-columns: repeat(2, 64px); gap: 10px; }
.pad button { width: 64px; height: 64px; border-radius: 50%; padding: 0; font-size: 13px; box-shadow: none; background: rgba(243,240,230,.16); border: 2px solid rgba(243,240,230,.35); color: var(--line); font-family: var(--font-body); font-weight: 700; letter-spacing: 0; }
.pad button.main { background: rgba(232,86,46,.55); border-color: var(--away); grid-row: span 2; align-self: center; }
.overlay { position: absolute; inset: 0; display: flex; justify-content: center; align-items: flex-start; padding: 16px; background: rgba(10,18,15,.86); overflow-y: auto; }
.sheet { width: 100%; max-width: 720px; display: flex; flex-direction: column; gap: 14px; padding-block: 8px 24px; }
.sheet h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(22px, 5vw, 30px); text-wrap: balance; }
.sheet p { margin: 0; line-height: 1.7; color: var(--muted); }
.budget { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--line); }
.budget b { font-family: var(--font-display); font-weight: 400; font-size: 20px; color: var(--gold); }
.groups { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.group { background: var(--panel); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.group h3 { margin: 0; font-size: 13px; letter-spacing: .12em; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; }
.row label { font-size: 13px; }
.row output { font-family: var(--font-display); font-size: 15px; font-variant-numeric: tabular-nums; }
.row small { grid-column: 1 / -1; font-size: 11px; color: var(--muted); line-height: 1.45; }
.row input { grid-column: 1 / -1; width: 100%; accent-color: var(--gold); }
.choices { display: flex; flex-wrap: wrap; gap: 8px; }
.choices label { display: flex; align-items: center; gap: 6px; background: var(--panel); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
.choices input { accent-color: var(--away); margin: 0; }
.choices label:has(input:checked) { outline: 2px solid var(--away); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
button {
  font-family: var(--font-display); font-size: 17px; letter-spacing: .06em;
  color: #fff; background: var(--away); border: 0; border-radius: 999px;
  padding: 11px 30px; cursor: pointer; box-shadow: 0 5px 0 #8f2a14;
}
button.ghost { background: transparent; box-shadow: none; border: 2px solid var(--muted); color: var(--line); }
button:active { transform: translateY(2px); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.result { display: grid; grid-template-columns: 1fr auto auto; gap: 6px 18px; font-variant-numeric: tabular-nums; max-width: 420px; }
.result span:nth-child(3n+2), .result span:nth-child(3n) { text-align: right; font-weight: 700; }
.result .hd { color: var(--muted); font-size: 12px; }
.final { font-family: var(--font-display); font-size: 52px; line-height: 1; }
@media (max-width: 640px) {
  .groups { grid-template-columns: minmax(0, 1fr); }
  .keys { display: none; }
}
@media (hover: hover) and (pointer: fine) { .pad { display: none; } }
@media (hover: none), (pointer: coarse) { .keys { display: none; } }
</style>

<div class="app">
  <div class="board">
    <h1><small>5対5・3分間</small>フットサル采配</h1>
    <div class="score"><span class="kit h"></span><span id="sH">0</span><span>-</span><span id="sA">0</span><span class="kit a"></span><span class="clock" id="clock">3:00</span></div>
  </div>
  <div class="field" id="field">
    <canvas id="pitch" aria-label="上から見たフットサルコート。白がホーム、オレンジがアウェイ"></canvas>
    <div class="keys" id="keys">移動 ←↑↓→ / WASD<br>Z パス・切替　X シュート・タックル　C ロブ</div>
    <div class="pad" id="pad">
      <button type="button" id="bA">パス</button>
      <button type="button" id="bB" class="main">シュート</button>
      <button type="button" id="bC">ロブ</button>
    </div>
    <div class="overlay" id="setup">
      <div class="sheet">
        <h2>チームの能力を振り分けて、キックオフ。</h2>
        <p>9 つの能力に合計 <span class="budget">50</span> ポイント（各 1〜10）。全員がこの能力をもとに動きます。数字の差が、競り合いや抜き合いの結果にそのまま出ます。</p>
        <div class="budget">残り <b id="left">0</b> ポイント</div>
        <div class="groups" id="groups"></div>
        <div>
          <p style="margin-bottom:8px">相手チーム</p>
          <div class="choices" id="opps"></div>
        </div>
        <div>
          <p style="margin-bottom:8px">遊び方</p>
          <div class="choices">
            <label><input type="radio" name="mode" value="play" checked>自分で操作する</label>
            <label><input type="radio" name="mode" value="watch">監督として観戦する</label>
          </div>
        </div>
        <div class="actions">
          <button type="button" id="kickoff">キックオフ</button>
          <button type="button" class="ghost" id="randomize">おまかせで振り分け</button>
        </div>
      </div>
    </div>
    <div class="overlay" id="result" hidden>
      <div class="sheet">
        <p id="resLabel">試合終了</p>
        <div class="final" id="resScore">0 - 0</div>
        <h2 id="resTitle"></h2>
        <div class="result" id="resTable"></div>
        <p id="resNote"></p>
        <div class="actions">
          <button type="button" id="again">同じチームでもう一試合</button>
          <button type="button" class="ghost" id="rebuild">能力を振り直す</button>
        </div>
      </div>
    </div>
  </div>
  <div class="ticker" id="ticker"><div>能力を決めてキックオフしてください。</div></div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  // ---------- stats ----------
  const GROUPS = [
    { name: "フィジカル", stats: [
      ["kick", "キック", "パスとシュートの速さ"],
      ["jump", "ジャンプ", "浮き球の競り合い、GK の届く範囲"],
      ["contact", "フィジカルコンタクト", "タックルで当たり負けしない強さ"]] },
    { name: "サッカーIQ", stats: [
      ["pos", "立ち位置", "空いた場所・守る場所に正しく立つ"],
      ["aggr", "積極性", "前からのプレス、前へのパス、遠目からのシュート"],
      ["pass", "消極性", "陣形を崩さない、無理せず安全なパス"]] },
    { name: "タッチ", stats: [
      ["dribble", "ドリブル", "持ったときの速さとトラップの確実さ"],
      ["body", "ボディコンタクト", "体を入れてボールを守る"],
      ["space", "間合い", "寄せる距離・かわす距離の正確さ"]] },
  ];
  const KEYS = GROUPS.flatMap(g => g.stats.map(s => s[0]));
  const NAMES = Object.fromEntries(GROUPS.flatMap(g => g.stats.map(s => [s[0], s[1]])));
  const BUDGET = 50;
  const PRESETS = {
    balance:  { name: "バランス",       v: [6, 5, 6, 6, 5, 5, 6, 5, 6] },
    physical: { name: "フィジカル軍団", v: [9, 9, 10, 4, 6, 2, 3, 5, 2] },
    tech:     { name: "テクニシャン",   v: [5, 3, 3, 6, 6, 3, 10, 5, 9] },
    brain:    { name: "頭脳派",         v: [5, 4, 4, 10, 4, 7, 5, 4, 7] },
    press:    { name: "前プレ命",       v: [7, 5, 7, 5, 10, 1, 6, 4, 5] },
  };
  let mine = PRESETS.balance.v.slice();

  function buildSetup() {
    $("groups").innerHTML = GROUPS.map(g => `<div class="group"><h3>${g.name}</h3>${g.stats.map(([k, n, d]) => {
      const i = KEYS.indexOf(k);
      return `<div class="row"><label for="st-${k}">${n}</label><output id="o-${k}">${mine[i]}</output><input type="range" id="st-${k}" min="1" max="10" step="1" value="${mine[i]}"><small>${d}</small></div>`;
    }).join("")}</div>`).join("");
    KEYS.forEach((k, i) => $("st-" + k).addEventListener("input", (e) => {
      const others = mine.reduce((s, v, j) => s + (j === i ? 0 : v), 0);
      const v = Math.min(+e.target.value, BUDGET - others);
      mine[i] = Math.max(1, v); e.target.value = mine[i]; $("o-" + k).value = mine[i]; budget();
    }));
    $("opps").innerHTML = Object.entries(PRESETS).map(([id, p], i) => `<label><input type="radio" name="opp" value="${id}" ${i === 1 ? "checked" : ""}>${p.name}</label>`).join("");
    budget();
  }
  function syncSliders() { KEYS.forEach((k, i) => { $("st-" + k).value = mine[i]; $("o-" + k).value = mine[i]; }); budget(); }
  function budget() { $("left").textContent = BUDGET - mine.reduce((a, b) => a + b, 0); }
  $("randomize").addEventListener("click", () => {
    mine = KEYS.map(() => 1); let left = BUDGET - KEYS.length;
    while (left > 0) { const i = Math.floor(Math.random() * KEYS.length); if (mine[i] < 10) { mine[i]++; left--; } }
    syncSliders();
  });

  // ---------- pitch geometry (metres) ----------
  const W = 20, L = 34, GOAL_W = 4.2, GX0 = W / 2 - GOAL_W / 2, GX1 = W / 2 + GOAL_W / 2, AREA = 6;
  const canvas = $("pitch"), ctx = canvas.getContext("2d");
  let cw = 0, ch = 0, sc = 1, ox = 0, oy = 0;
  function resize() {
    const r = $("field").getBoundingClientRect(); const dpr = Math.min(devicePixelRatio || 1, 2);
    cw = r.width; ch = r.height; canvas.width = cw * dpr; canvas.height = ch * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    sc = Math.min(cw / (W + 2.4), ch / (L + 2.4)); ox = (cw - W * sc) / 2; oy = (ch - L * sc) / 2;
  }
  const X = (x) => ox + x * sc, Y = (y) => oy + y * sc;

  // ---------- helpers ----------
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rnd = (a = 0, b = 1) => a + Math.random() * (b - a);
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  const norm = (x, y) => { const d = Math.hypot(x, y) || 1; return [x / d, y / d]; };
  function segDist(p, a, b) {
    const dx = b.x - a.x, dy = b.y - a.y, l2 = dx * dx + dy * dy || 1;
    const t = clamp(((p.x - a.x) * dx + (p.y - a.y) * dy) / l2, 0, 1);
    return Math.hypot(p.x - (a.x + t * dx), p.y - (a.y + t * dy));
  }
  // team 0 (home) attacks the top goal (y = 0); team 1 attacks the bottom goal (y = L)
  const goalY = (t) => t === 0 ? 0 : L;
  const ownGoalY = (t) => t === 0 ? L : 0;
  const fwd = (t) => t === 0 ? -1 : 1;

  // ---------- state ----------
  const ROLES = [
    { id: "GK", x: 10, y: 32.6 }, { id: "FIXO", x: 10, y: 26 },
    { id: "ALA", x: 4.5, y: 20 }, { id: "ALA", x: 15.5, y: 20 }, { id: "PIVO", x: 10, y: 13.5 },
  ];
  let players = [], ball, teams, clock, state = "setup", mode = "play", user = -1, events = [], restart = null, pause = 0;
  const input = { x: 0, y: 0, a: false, b: false, c: false };

  function teamStats(vals) { return Object.fromEntries(KEYS.map((k, i) => [k, (vals[i] - 1) / 9])); }
  function makeTeams(oppId) {
    teams = [
      { name: "ホーム", cls: "h", st: teamStats(mine), goals: 0, shots: 0, poss: 0, tackles: 0, aerials: 0, beaten: 0, passes: 0, passOk: 0 },
      { name: PRESETS[oppId].name, cls: "a", st: teamStats(PRESETS[oppId].v), goals: 0, shots: 0, poss: 0, tackles: 0, aerials: 0, beaten: 0, passes: 0, passOk: 0 },
    ];
    players = [];
    teams.forEach((tm, t) => ROLES.forEach((r, i) => {
      const st = {};
      KEYS.forEach(k => st[k] = clamp(tm.st[k] + rnd(-.06, .06), 0, 1));
      if (r.id === "PIVO") st.aggr = clamp(st.aggr + .1, 0, 1);
      if (r.id === "FIXO") st.pass = clamp(st.pass + .1, 0, 1);
      players.push({ id: players.length, team: t, role: r.id, slot: i, num: [1, 4, 7, 11, 9][i], st,
        x: 0, y: 0, vx: 0, vy: 0, face: fwd(t) * Math.PI / 2, stun: 0, jumpT: 0, think: 0, hold: 0,
        tx: 0, ty: 0, drift: [0, 0], driftT: 0, pressD: 1.3, pressT: 0, tackleCd: 0, spot: null, spotT: 0 });
    }));
  }
  function base(p) {
    const r = ROLES[p.slot];
    return p.team === 0 ? { x: r.x, y: r.y } : { x: W - r.x, y: L - r.y };
  }

  function kickoff(team) {
    players.forEach(p => {
      const b = base(p);
      // own half only at kick-off
      p.x = b.x; p.y = p.team === 0 ? Math.max(b.y, L / 2 + 1) : Math.min(b.y, L / 2 - 1);
      if (p.role === "GK") p.y = b.y;
      p.vx = p.vy = 0; p.stun = 0; p.hold = .6; p.face = fwd(p.team) * Math.PI / 2;
    });
    const taker = players.find(p => p.team === team && p.role === "PIVO");
    taker.x = W / 2; taker.y = L / 2 - fwd(team) * .7;
    ball = { x: W / 2, y: L / 2, z: 0, vx: 0, vy: 0, vz: 0, owner: taker, last: taker, lastT: 0, tried: new Set(), shot: false, pass: null };
    restart = null; pause = .8;
    if (mode === "play") user = team === 0 ? taker.id : nearestField(0, ball).id;
  }

  // ---------- events ----------
  function say(team, text) {
    events.unshift({ cls: team == null ? "" : teams[team].cls, text });
    events = events.slice(0, 3);
    $("ticker").innerHTML = events.map(e => `<div class="${e.cls}">${e.text}</div>`).join("");
  }
  const who = (p) => `${teams[p.team].name}の${p.num}番`;

  // ---------- ball actions ----------
  function kick(p, tx, ty, speed, vz, kind) {
    const [dx, dy] = norm(tx - p.x, ty - p.y);
    ball.owner = null; ball.vx = dx * speed; ball.vy = dy * speed; ball.vz = vz; ball.z = Math.max(ball.z, .05);
    ball.last = p; ball.lastT = .28; ball.tried = new Set(); ball.shot = kind === "shot"; ball.pass = kind === "pass" ? p.team : null;
    p.face = Math.atan2(dy, dx); p.hold = 0;
    if (kind === "pass") teams[p.team].passes++;
  }
  function passTo(p, r, lob) {
    const lead = .35;
    const tx = r.x + r.vx * lead, ty = r.y + r.vy * lead, d = Math.hypot(tx - p.x, ty - p.y);
    if (lob) {
      const vz = 5.5 + p.st.kick * 2 + d * .12, flight = 2 * vz / 9.8;
      kick(p, tx, ty, d / flight * 1.05, vz, "pass");
    } else {
      const sp = Math.min(9 + p.st.kick * 9, d * 1.6 + 6);
      kick(p, tx, ty, sp, 0, "pass");
    }
  }
  function shoot(p, aimX) {
    const gk = players.find(q => q.team !== p.team && q.role === "GK");
    let tx = aimX != null ? aimX : (gk.x > W / 2 ? rnd(GX0 + .3, W / 2 - .3) : rnd(W / 2 + .3, GX1 - .3));
    const pressure = pressureOn(p);
    const err = (rnd() - .5) * (.16 + pressure * .22 + (1 - p.st.dribble) * .06);
    const ty = goalY(p.team);
    const ang = Math.atan2(ty - p.y, tx - p.x) + err;
    const sp = 14 + p.st.kick * 13;
    kick(p, p.x + Math.cos(ang) * 10, p.y + Math.sin(ang) * 10, sp, rnd(.5, 2.2) + pressure, "shot");
    teams[p.team].shots++;
    if (p.st.kick > .75 && dist(p, { x: W / 2, y: ty }) > 11) say(p.team, `${who(p)}、キック力を生かしたミドルシュート`);
  }
  function pressureOn(p) {
    let m = 9;
    players.forEach(q => { if (q.team !== p.team && q.stun <= 0) m = Math.min(m, dist(p, q)); });
    return clamp((2.6 - m) / 2.6, 0, 1);
  }
  function laneOpen(a, b, team) {
    let worst = 9;
    players.forEach(q => { if (q.team !== team && q.role !== "GK") worst = Math.min(worst, segDist(q, a, b)); });
    return worst;
  }

  function tackle(d, a) {
    // d tries to win the ball from carrier a
    const gap = dist(d, a);
    if (gap > 1.7) return false;
    let p = .48 + .32 * (d.st.contact - a.st.body) + .25 * (d.st.space - a.st.space) - .18 * a.st.dribble + .08;
    p -= .3 * Math.abs(gap - 1.1) * (1 - d.st.space);
    p = clamp(p, .08, .88);
    d.tackleCd = 1.1;
    if (Math.random() < p) {
      teams[d.team].tackles++;
      const why = d.st.contact - a.st.body > .2 ? "フィジカルコンタクトで" : d.st.space > .6 ? "うまい間合いで" : "";
      if (Math.random() < .45 + d.st.body * .4) { ball.owner = d; ball.last = d; d.hold = .25; say(d.team, `${who(d)}が${why}ボールを奪った`); }
      else {
        ball.owner = null; const a2 = rnd(0, Math.PI * 2); ball.vx = Math.cos(a2) * 5; ball.vy = Math.sin(a2) * 5; ball.last = d; ball.lastT = .2; ball.tried = new Set();
        say(d.team, `${who(d)}が${why}ボールをつついた`);
      }
      a.stun = .35;
      return true;
    }
    d.stun = .75; teams[a.team].beaten++;
    say(a.team, a.st.body > d.st.contact + .15 ? `${who(a)}がボディコンタクトでキープ` : `${who(a)}がタックルをかわした`);
    return false;
  }

  // ---------- AI ----------
  function nearestField(team, pt, exclude) {
    let best = null, bd = 1e9;
    players.forEach(p => { if (p.team === team && p.role !== "GK" && p !== exclude) { const d = dist(p, pt); if (d < bd) { bd = d; best = p; } } });
    return best;
  }
  function ballLanding() {
    if (ball.owner || ball.z <= .1 && ball.vz <= 0) return { x: ball.x + ball.vx * .25, y: ball.y + ball.vy * .25 };
    const t = (ball.vz + Math.sqrt(ball.vz * ball.vz + 2 * 9.8 * ball.z)) / 9.8;
    return { x: ball.x + ball.vx * t * .95, y: ball.y + ball.vy * t * .95 };
  }

  function think(p, dt) {

  // ---------- step ----------
  function step(dt) {

  }

  // ---------- render ----------
  function drawPitch() {
    ctx.fillStyle = "#0f1a17"; ctx.fillRect(0, 0, cw, ch);
    // turf stripes
    for (let i = 0; i < 10; i++) { ctx.fillStyle = i % 2 ? "#215e3d" : "#1d5537"; ctx.fillRect(X(0), Y(i * L / 10), W * sc, L / 10 * sc + 1); }

    ctx.strokeRect(X(0), Y(0), W * sc, L * sc);
    ctx.beginPath(); ctx.moveTo(X(0), Y(L / 2)); ctx.lineTo(X(W), Y(L / 2)); ctx.stroke();
    ctx.beginPath(); ctx.arc(X(W / 2), Y(L / 2), 3 * sc, 0, Math.PI * 2); ctx.stroke();
    [0, L].forEach(gy => {
      const s = gy === 0 ? 1 : -1, top = s > 0;
      // futsal area: quarter circles round each post joined by a straight line
      ctx.beginPath();
      ctx.arc(X(GX0), Y(gy), AREA * sc, Math.PI, top ? Math.PI / 2 : Math.PI * 1.5, top);
      ctx.lineTo(X(GX1), Y(gy + s * AREA));
      ctx.arc(X(GX1), Y(gy), AREA * sc, top ? Math.PI / 2 : Math.PI * 1.5, top ? 0 : Math.PI * 2, top);
      ctx.stroke();
      ctx.fillStyle = "rgba(238,240,226,.85)"; ctx.beginPath(); ctx.arc(X(W / 2), Y(gy + s * 6), sc * .15, 0, 7); ctx.fill();
      // goal frame + net
      ctx.fillStyle = "rgba(238,240,226,.12)"; ctx.fillRect(X(GX0), Y(gy) - (s > 0 ? 1.2 * sc : 0), GOAL_W * sc, 1.2 * sc);
      ctx.strokeStyle = "#eef0e2"; ctx.lineWidth = Math.max(2, sc * .16);
      ctx.strokeRect(X(GX0), Y(gy) - (s > 0 ? 1.2 * sc : 0), GOAL_W * sc, 1.2 * sc);
      ctx.lineWidth = Math.max(1.5, sc * .1); ctx.strokeStyle = "rgba(238,240,226,.85)";
    });
  }
  function drawPlayer(p) {
    const r = .62 * sc * (1 + (p.jumpT > 0 ? Math.sin(p.jumpT / .45 * Math.PI) * .35 : 0));
    ctx.fillStyle = "rgba(0,0,0,.3)"; ctx.beginPath(); ctx.ellipse(X(p.x) + sc * .12, Y(p.y) + sc * .18, .62 * sc, .52 * sc, 0, 0, 7); ctx.fill();
    const gk = p.role === "GK";
    const fill = p.team === 0 ? (gk ? "#f2c230" : "#f3f0e6") : (gk ? "#6a3fb5" : "#e8562e");
    ctx.fillStyle = p.stun > 0 ? "rgba(140,150,145,.9)" : fill;
    ctx.beginPath(); ctx.arc(X(p.x), Y(p.y), r, 0, 7); ctx.fill();
    // facing notch
    ctx.strokeStyle = p.team === 0 ? "#22306b" : "#fff"; ctx.lineWidth = Math.max(1.5, sc * .09);
    ctx.beginPath(); ctx.moveTo(X(p.x) + Math.cos(p.face) * r * .55, Y(p.y) + Math.sin(p.face) * r * .55); ctx.lineTo(X(p.x) + Math.cos(p.face) * r * 1.05, Y(p.y) + Math.sin(p.face) * r * 1.05); ctx.stroke();
    ctx.fillStyle = p.team === 0 ? "#22306b" : "#fff";
    ctx.font = `700 ${Math.max(10, sc * .62)}px "Zen Kaku Gothic New", system-ui, sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(p.num, X(p.x), Y(p.y) + 1);
    if (mode === "play" && p.id === user) {
      ctx.strokeStyle = "#f2c230"; ctx.lineWidth = Math.max(2, sc * .12);
      ctx.beginPath(); ctx.arc(X(p.x), Y(p.y), r + sc * .28, 0, 7); ctx.stroke();
      ctx.fillStyle = "#f2c230"; ctx.beginPath(); ctx.moveTo(X(p.x), Y(p.y) - r - sc * .45); ctx.lineTo(X(p.x) - sc * .3, Y(p.y) - r - sc * .95); ctx.lineTo(X(p.x) + sc * .3, Y(p.y) - r - sc * .95); ctx.fill();
    }
  }
  function draw() {
    drawPitch();
    if (!ball) return;
    players.forEach(drawPlayer);
    // ball + shadow
    ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.beginPath(); ctx.arc(X(ball.x) + ball.z * sc * .35, Y(ball.y) + ball.z * sc * .5, .22 * sc, 0, 7); ctx.fill();
    const br = .3 * sc * (1 + ball.z * .18);
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(X(ball.x), Y(ball.y), br, 0, 7); ctx.fill();
    ctx.strokeStyle = "#111"; ctx.lineWidth = 1; ctx.stroke();
    if (flash > 0) {
      ctx.globalAlpha = Math.min(1, flash);
      ctx.fillStyle = "#f2c230"; ctx.font = `${Math.max(28, sc * 2.6)}px "Dela Gothic One", system-ui, sans-serif`; ctx.textAlign = "center";
      ctx.fillText("GOAL!", cw / 2, ch / 2); ctx.globalAlpha = 1;
    }
  }

  // ---------- flow ----------
  function startMatch() {
    const opp = document.querySelector('input[name="opp"]:checked').value;
    mode = document.querySelector('input[name="mode"]:checked').value;
    makeTeams(opp);
    clock = 180; events = [];
    $("sH").textContent = 0; $("sA").textContent = 0;
    $("setup").hidden = true; $("result").hidden = true;
    say(null, `キックオフ。ホーム vs ${teams[1].name}`);
    kickoff(0); state = "play";
    $("pad").style.visibility = mode === "play" ? "visible" : "hidden";
    $("keys").style.visibility = mode === "play" ? "visible" : "hidden";
  }
  function endMatch() {
    state = "over";
    const [h, a] = teams, total = h.poss + a.poss || 1;
    $("resScore").textContent = `${h.goals} - ${a.goals}`;
    $("resLabel").textContent = `試合終了　ホーム vs ${a.name}`;
    $("resTitle").textContent = h.goals > a.goals ? "勝利!" : h.goals < a.goals ? "敗戦" : "引き分け";
    const rows = [["ボール保持", Math.round(h.poss / total * 100) + "%", Math.round(a.poss / total * 100) + "%"],
      ["シュート", h.shots, a.shots], ["パス成功", `${h.passOk}/${h.passes}`, `${a.passOk}/${a.passes}`],
      ["ボール奪取", h.tackles, a.tackles], ["空中戦の勝ち", h.aerials, a.aerials], ["ドリブル突破・キープ", h.beaten, a.beaten]];
    $("resTable").innerHTML = `<span class="hd"></span><span class="hd">ホーム</span><span class="hd">${a.name}</span>` + rows.map(r => r.map(c => `<span>${c}</span>`).join("")).join("");
    // name the stat gap that mattered most
    const diffs = KEYS.map(k => [k, h.st[k] - a.st[k]]).sort((x, y) => Math.abs(y[1]) - Math.abs(x[1]));
    const [k, d] = diffs[0];
    $("resNote").textContent = `いちばん差があった能力は「${NAMES[k]}」（${d > 0 ? "ホームが上" : "相手が上"}）。`;
    $("result").hidden = false; $("again").focus();
  }
  $("kickoff").addEventListener("click", startMatch);
  $("again").addEventListener("click", startMatch);
  $("rebuild").addEventListener("click", () => { $("result").hidden = true; $("setup").hidden = false; state = "setup"; });

  // ---------- input ----------
  const held = {};
  function keyVec() {
    input.x = (held.ArrowRight || held.KeyD ? 1 : 0) - (held.ArrowLeft || held.KeyA ? 1 : 0);
    input.y = (held.ArrowDown || held.KeyS ? 1 : 0) - (held.ArrowUp || held.KeyW ? 1 : 0);
    const m = Math.hypot(input.x, input.y); if (m > 1) { input.x /= m; input.y /= m; }
  }
  addEventListener("keydown", (e) => {
    if (state !== "play") return;
    if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
    if (e.repeat) return;
    held[e.code] = true; keyVec();
    if (e.code === "KeyZ" || e.code === "KeyJ" || e.code === "Space") input.a = true;
    if (e.code === "KeyX" || e.code === "KeyK") input.b = true;
    if (e.code === "KeyC" || e.code === "KeyL") input.c = true;
  });
  addEventListener("keyup", (e) => { held[e.code] = false; keyVec(); });
  // touch stick: drag anywhere on the left 60% of the pitch
  let stick = null;
  canvas.addEventListener("pointerdown", (e) => {
    if (e.pointerType === "mouse") return;
    const r = canvas.getBoundingClientRect();
    if (e.clientX - r.left > r.width * .6) return;
    stick = { id: e.pointerId, x: e.clientX, y: e.clientY }; canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener("pointermove", (e) => {
    if (!stick || e.pointerId !== stick.id) return;
    const dx = e.clientX - stick.x, dy = e.clientY - stick.y, m = Math.hypot(dx, dy);
    const k = Math.min(1, m / 50) / (m || 1); input.x = dx * k; input.y = dy * k;
  });
  const endStick = (e) => { if (stick && e.pointerId === stick.id) { stick = null; input.x = input.y = 0; } };
  canvas.addEventListener("pointerup", endStick); canvas.addEventListener("pointercancel", endStick);
  [["bA", "a"], ["bB", "b"], ["bC", "c"]].forEach(([id, k]) => $(id).addEventListener("pointerdown", (e) => { e.preventDefault(); input[k] = true; }));

  function labels() {
    const p = mode === "play" && players[user];
    const att = p && ball && ball.owner === p;
    $("bA").textContent = att ? "パス" : "切替";
    $("bB").textContent = att ? "シュート" : "タックル";
    $("bC").style.opacity = att ? 1 : .35;
  }

  // ---------- loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(.04, (now - last) / 1000); last = now;
    if (state === "play") step(dt);
    if (flash > 0) flash -= dt;
    if (clock != null) { const s = Math.ceil(clock); $("clock").textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }
    labels(); draw();
    requestAnimationFrame(frame);
  }
  addEventListener("resize", resize);
  buildSetup(); resize();
  // demo match behind the setup sheet so the first frame shows the game
  makeTeams("physical"); mode = "watch"; kickoff(0); clock = 180;
  requestAnimationFrame(frame);
})();
</script>
