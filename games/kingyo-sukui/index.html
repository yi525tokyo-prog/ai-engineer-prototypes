<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>夜店の金魚すくい</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* Layout: one-screen stall — signboard on top, the tub (canvas) in the middle, the catch bowl below. Single dark "summer night" look by choice. */
:root {
  --night: #141a33;      /* sky behind the stall */
  --night-2: #1d2547;    /* panels */
  --lantern: #e4483a;    /* chochin red, the one bold accent */
  --paper: #f3ecdc;      /* poi paper / text */
  --muted: #a3a9c8;      /* secondary text */
  --water: #2c74b8;
  --gold: #f2b43c;
  --font-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; }
body {
  background: radial-gradient(120% 70% at 50% 0%, #2a2350 0%, var(--night) 60%) var(--night);
  color: var(--paper);
  font-family: var(--font-body);
  font-size: 15px;
}
.stall {
  max-width: 760px; margin: 0 auto;
  padding-inline: 16px; padding-block: 14px 20px;
  display: flex; flex-direction: column; gap: 12px;
}
.lanterns { display: flex; justify-content: space-between; height: 22px; }
.lanterns span {
  width: 18px; height: 22px; border-radius: 45%;
  background: radial-gradient(circle at 50% 45%, #ffb07a 0%, var(--lantern) 55%, #8f2219 100%);
  box-shadow: 0 0 14px rgba(228, 72, 58, .55);
  animation: sway 3.2s ease-in-out infinite alternate;
  transform-origin: 50% -10px;
}
.lanterns span:nth-child(2n) { animation-delay: -1.4s; }
@keyframes sway { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }
header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 {
  margin: 0; font-family: var(--font-display); font-weight: 400;
  font-size: clamp(26px, 6vw, 40px); line-height: 1.05; letter-spacing: .04em;
  color: var(--paper); text-wrap: balance;
}
h1 small { display: block; font-family: var(--font-body); font-size: 12px; letter-spacing: .2em; color: var(--muted); font-weight: 700; margin-bottom: 4px; }
.hud { display: flex; gap: 18px; align-items: flex-end; font-variant-numeric: tabular-nums; }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat b { font-size: 11px; letter-spacing: .14em; color: var(--muted); font-weight: 700; }
.stat output { font-family: var(--font-display); font-size: 26px; line-height: 1; }
.pois { display: flex; gap: 5px; height: 26px; align-items: center; }
.pois i { width: 18px; height: 18px; border-radius: 50%; border: 3px solid var(--lantern); background: var(--paper); }
.pois i.used { background: transparent; border-color: #4a5078; }
.meter { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: .1em; }
.bar { flex: 1; height: 8px; background: #2b335c; border-radius: 4px; overflow: hidden; }
.bar div { height: 100%; width: 100%; background: var(--paper); transition: background .2s; }
.tub { position: relative; width: 100%; border-radius: 22px; overflow: hidden; box-shadow: 0 18px 50px rgba(0,0,0,.45); }
canvas { display: block; width: 100%; touch-action: none; cursor: none; }
.overlay {
  position: absolute; inset: 0; display: grid; place-items: center; padding: 20px;
  background: rgba(13, 18, 40, .72); backdrop-filter: blur(2px); text-align: center;
}
.card { max-width: 420px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.card h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(24px, 6vw, 34px); text-wrap: balance; }
.card p { margin: 0; line-height: 1.75; color: var(--paper); }
.card .rules { color: var(--muted); font-size: 13.5px; text-align: left; }
.card .rules kbd { font-family: var(--font-body); border: 1px solid #4a5078; border-radius: 4px; padding: 0 5px; font-size: 12px; }
button {
  font-family: var(--font-display); font-size: 18px; letter-spacing: .08em;
  color: var(--paper); background: var(--lantern); border: 0; border-radius: 999px;
  padding: 12px 34px; cursor: pointer; box-shadow: 0 6px 0 #8f2219;
}
button:active { transform: translateY(3px); box-shadow: 0 3px 0 #8f2219; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.big { font-family: var(--font-display); font-size: 56px; line-height: 1; color: var(--gold); }
.bowl { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.kind { background: var(--night-2); border-radius: 12px; padding: 10px; display: flex; gap: 10px; align-items: center; min-width: 0; }
.kind canvas { width: 34px; height: 22px; flex: none; cursor: default; }
.kind div { min-width: 0; display: flex; flex-direction: column; }
.kind b { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kind span { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.kind output { margin-left: auto; font-family: var(--font-display); font-size: 20px; font-variant-numeric: tabular-nums; }
@media (max-width: 560px) {
  .bowl { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .hud { gap: 14px; }
}
@media (prefers-reduced-motion: reduce) { .lanterns span { animation: none; } }
</style>
</head>
<body>

<div class="stall">
  <div class="lanterns" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
  <header>
    <h1><small>夏祭り・一回三百円</small>金魚すくい</h1>
    <div class="hud">
      <div class="stat"><b>ポイ</b><div class="pois" id="pois"></div></div>
      <div class="stat"><b>点数</b><output id="score">0</output></div>
      <div class="stat"><b>最高</b><output id="best">0</output></div>
    </div>
  </header>
  <div class="meter"><span>紙の強さ</span><div class="bar"><div id="health"></div></div></div>
  <div class="tub" id="tub">
    <canvas id="c" aria-label="金魚の泳ぐ水槽。押して水に入れ、離してすくう"></canvas>
    <div class="overlay" id="startScreen">
      <div class="card">
        <h2>ポイは三本。<br>破れたらおしまい。</h2>
        <div class="rules">
          <p>・押している間、ポイが水に入ります。離すとすくい上げます。</p>
          <p>・水の中で速く動かすと紙が破れやすく、金魚も逃げます。</p>
          <p>・重い金魚ほど紙に負担がかかります。濡れた紙は弱くなります。</p>
          <p>・キーボードなら <kbd>←↑↓→</kbd> で移動、<kbd>Space</kbd> で入れる／すくう。</p>
        </div>
        <button id="startBtn" type="button">はじめる</button>
      </div>
    </div>
    <div class="overlay" id="endScreen" hidden>
      <div class="card">
        <p id="rankLabel">称号</p>
        <div class="big" id="finalScore">0</div>
        <h2 id="rankName">見習い</h2>
        <p id="endNote"></p>
        <button id="againBtn" type="button">もう一回</button>
      </div>
    </div>
  </div>
  <div class="bowl" id="bowl"></div>
</div>

<script>
(() => {
  const TYPES = [
    { id: "aka",    name: "和金",     pts: 1,  len: 24, speed: 62, weight: .10, weightRare: 50 },
    { id: "sarasa", name: "更紗",     pts: 2,  len: 28, speed: 56, weight: .15, weightRare: 26 },
    { id: "deme",   name: "黒出目金", pts: 3,  len: 32, speed: 40, weight: .24, weightRare: 18 },
    { id: "kin",    name: "黄金",     pts: 10, len: 26, speed: 95, weight: .18, weightRare: 6 },
  ];
  const POI_R = 34, MAX_FISH = 11, MIN_FISH = 7;

  const $ = (id) => document.getElementById(id);
  const canvas = $("c"), ctx = canvas.getContext("2d");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  let W = 0, H = 0, dpr = 1;
  let fish = [], ripples = [], pops = [], drops = [];
  let poi, state = "title", score = 0, poisLeft = 3, caught = {}, best = 0, t = 0;

  try { best = +localStorage.getItem("kingyo-best") || 0; } catch (e) {}

  function resize() {
    const w = canvas.parentElement.clientWidth;
    const maxH = Math.max(300, innerHeight - 260);
    W = w; H = Math.round(Math.min(w * (w < 560 ? 1.05 : 0.68), maxH));
    dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    fish.forEach(f => { f.x = Math.min(f.x, W - 30); f.y = Math.min(f.y, H - 30); });
  }

  function pickType() {
    const total = TYPES.reduce((s, k) => s + k.weightRare, 0);
    let r = Math.random() * total;
    for (const k of TYPES) { if ((r -= k.weightRare) < 0) return k; }
    return TYPES[0];
  }
  function spawnFish(fromEdge) {
    const type = pickType();
    const a = Math.random() * Math.PI * 2;
    let x = 40 + Math.random() * (W - 80), y = 40 + Math.random() * (H - 80);
    if (fromEdge) { x = Math.random() < .5 ? -20 : W + 20; }
    fish.push({ type, x, y, a, turn: 0, sp: type.speed * (.7 + Math.random() * .5),
      phase: Math.random() * 6, flee: 0, spots: Array.from({ length: 3 }, () => [Math.random() * .8 - .3, Math.random() - .5, .25 + Math.random() * .25]) });
  }

  function newPoi() {
    poi = { x: W / 2, y: H / 2, vx: 0, vy: 0, down: false, health: 1, torn: 0, wet: 0, lastX: W / 2, lastY: H / 2 };
  }

  function reset() {
    fish = []; ripples = []; pops = []; drops = [];
    score = 0; poisLeft = 3; caught = {};
    TYPES.forEach(k => caught[k.id] = 0);
    for (let i = 0; i < 9; i++) spawnFish(false);
    newPoi(); renderHud();
  }

  // ---------- input ----------
  const keys = {};
  function toLocal(e) { const r = canvas.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
  canvas.addEventListener("pointerdown", (e) => {
    if (state !== "play") return;
    canvas.setPointerCapture(e.pointerId);
    [poi.x, poi.y] = toLocal(e); poi.lastX = poi.x; poi.lastY = poi.y;
    dip();
  });
  canvas.addEventListener("pointermove", (e) => { if (state === "play" || state === "title") [poi.x, poi.y] = toLocal(e); });
  canvas.addEventListener("pointerup", () => lift());
  canvas.addEventListener("pointercancel", () => lift());
  addEventListener("keydown", (e) => {
    if (state !== "play") return;
    if (e.code === "Space") { e.preventDefault(); if (!e.repeat) dip(); }
    if (e.key.startsWith("Arrow")) { e.preventDefault(); keys[e.key] = true; }
  });
  addEventListener("keyup", (e) => {
    if (e.code === "Space") lift();
    keys[e.key] = false;
  });

  function dip() {
    if (state !== "play" || poi.down || poi.torn) return;
    poi.down = true;
    ripples.push({ x: poi.x, y: poi.y, r: POI_R * .6, life: 1 });
    ripples.push({ x: poi.x, y: poi.y, r: POI_R * .3, life: 1.2 });
  }

  function lift() {
    if (!poi.down || poi.torn) return;
    poi.down = false;
    const inside = fish.filter(f => Math.hypot(f.x - poi.x, f.y - poi.y) < POI_R - f.type.len * .22);
    if (!inside.length) return;
    // wet paper is weaker: the same fish costs more the longer the poi was under
    const load = inside.reduce((s, f) => s + f.type.weight, 0) * (1 + poi.wet * .5) * (inside.length > 1 ? 1.15 : 1);
    if (load >= poi.health) { tear(inside); return; }
    poi.health -= load;
    let gained = 0;
    inside.forEach(f => {
      caught[f.type.id]++; gained += f.type.pts;
      for (let i = 0; i < 5; i++) drops.push({ x: f.x, y: f.y, vx: (Math.random() - .5) * 120, vy: -60 - Math.random() * 120, life: .6 });
    });
    fish = fish.filter(f => !inside.includes(f));
    score += gained;
    pops.push({ x: poi.x, y: poi.y - POI_R - 6, text: "+" + gained + (inside.length > 1 ? " 同時!" : ""), life: 1.1, gold: inside.some(f => f.type.id === "kin") });
    renderHud();
  }

  function tear(escaping) {
    poi.torn = 1; poi.down = false; poi.health = 0; poisLeft--;
    pops.push({ x: poi.x, y: poi.y - POI_R - 6, text: "破れた!", life: 1.2, bad: true });
    ripples.push({ x: poi.x, y: poi.y, r: POI_R, life: 1.3 });
    (escaping || []).forEach(f => { f.flee = 1.2; f.a = Math.atan2(f.y - poi.y, f.x - poi.x); });
    renderHud();
    setTimeout(() => {
      if (poisLeft <= 0) endGame();
      else { const x = poi.x, y = poi.y; newPoi(); poi.x = x; poi.y = y; renderHud(); }
    }, 900);
  }

  // ---------- update ----------
  function update(dt) {
    t += dt;
    if (state === "play" && !poi.torn) {
      const kx = (keys.ArrowRight ? 1 : 0) - (keys.ArrowLeft ? 1 : 0), ky = (keys.ArrowDown ? 1 : 0) - (keys.ArrowUp ? 1 : 0);
      poi.x += kx * 240 * dt; poi.y += ky * 240 * dt;
    }
    poi.x = Math.max(8, Math.min(W - 8, poi.x)); poi.y = Math.max(8, Math.min(H - 8, poi.y));
    const ivx = (poi.x - poi.lastX) / dt, ivy = (poi.y - poi.lastY) / dt;
    poi.vx += (ivx - poi.vx) * .3; poi.vy += (ivy - poi.vy) * .3;
    poi.lastX = poi.x; poi.lastY = poi.y;
    const pSpeed = Math.hypot(poi.vx, poi.vy);

    if (state === "play" && poi.down && !poi.torn) {
      poi.wet = Math.min(1, poi.wet + dt * .09);
      poi.health -= dt * .035 + Math.max(0, pSpeed - 140) * dt * .0006;
      if (pSpeed > 200 && Math.random() < dt * 14) ripples.push({ x: poi.x, y: poi.y, r: POI_R * .7, life: .7 });
      if (poi.health <= 0) tear([]);
      healthBar();
    }

    for (const f of fish) {
      f.phase += dt * (6 + f.flee * 10);
      const dx = f.x - poi.x, dy = f.y - poi.y, d = Math.hypot(dx, dy);
      // fish only spook at a poi thrashing through the water, or one splashing down right on top of them
      if (state === "play" && poi.down && d < 130 && pSpeed > 260) { f.flee = Math.max(f.flee, .9); f.a = Math.atan2(dy, dx) + (Math.random() - .5) * .6; }
      f.flee = Math.max(0, f.flee - dt);
      f.turn += (Math.random() - .5) * dt * 6; f.turn *= .96;
      f.a += f.turn * dt;
      const m = 34;
      if (f.x < m || f.x > W - m || f.y < m || f.y > H - m) {
        const toC = Math.atan2(H / 2 - f.y, W / 2 - f.x);
        let diff = ((toC - f.a + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
        f.a += diff * dt * 2.5;
      }
      const sp = f.sp * (1 + f.flee * 2.4) * (.75 + .25 * Math.sin(f.phase * .3));
      f.x += Math.cos(f.a) * sp * dt; f.y += Math.sin(f.a) * sp * dt;
    }
    if (fish.length < MIN_FISH || (fish.length < MAX_FISH && Math.random() < dt * .25)) spawnFish(true);

    ripples.forEach(r => { r.r += dt * 60; r.life -= dt; });
    ripples = ripples.filter(r => r.life > 0);
    pops.forEach(p => { p.y -= dt * 30; p.life -= dt; });
    pops = pops.filter(p => p.life > 0);
    drops.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 400 * dt; p.life -= dt; });
    drops = drops.filter(p => p.life > 0);
    if (poi.torn) poi.torn += dt;
  }

  // ---------- draw ----------
  function drawWater() {
    const g = ctx.createRadialGradient(W / 2, H * .45, 10, W / 2, H / 2, Math.max(W, H) * .75);
    g.addColorStop(0, "#3d8fd6"); g.addColorStop(.6, "#2a6eb0"); g.addColorStop(1, "#1b4a85");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // light caustics
    ctx.save(); ctx.globalCompositeOperation = "lighter";
    const tt = reduced ? 0 : t;
    for (let i = 0; i < 9; i++) {
      const x = (W * (i * .137 + .05) + Math.sin(tt * .3 + i) * 40) % W;
      const y = (H * ((i * .291) % 1) + Math.cos(tt * .25 + i * 2) * 30);
      const r = 60 + (i % 3) * 30;
      const cg = ctx.createRadialGradient(x, y, 0, x, y, r);
      cg.addColorStop(0, "rgba(160,215,255,.10)"); cg.addColorStop(1, "rgba(160,215,255,0)");
      ctx.fillStyle = cg; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  function fishPath(c, L) {
    c.beginPath();
    c.moveTo(L * .5, 0);
    c.bezierCurveTo(L * .45, -L * .28, -L * .2, -L * .3, -L * .32, 0);
    c.bezierCurveTo(-L * .2, L * .3, L * .45, L * .28, L * .5, 0);
  }

  function drawFishShape(c, type, L, phase, spots, shadow) {
    const wag = Math.sin(phase) * .45;
    // tail
    c.save(); c.translate(-L * .3, 0); c.rotate(wag);
    c.beginPath(); c.moveTo(0, 0);
    c.quadraticCurveTo(-L * .35, -L * .45, -L * .6, -L * .3);
    c.quadraticCurveTo(-L * .42, 0, -L * .6, L * .3);
    c.quadraticCurveTo(-L * .35, L * .45, 0, 0);
    c.fillStyle = shadow ? "rgba(10,30,60,.28)" : type.id === "deme" ? "rgba(30,30,40,.8)" : type.id === "kin" ? "rgba(255,206,92,.75)" : "rgba(240,90,60,.72)";
    c.fill(); c.restore();
    if (type.id === "deme" && !shadow) {
      c.fillStyle = "#1a1a22";
      [-1, 1].forEach(s => { c.beginPath(); c.arc(L * .32, s * L * .2, L * .12, 0, Math.PI * 2); c.fill(); });
    }
    fishPath(c, L);
    if (shadow) { c.fillStyle = "rgba(10,30,60,.28)"; c.fill(); return; }
    const body = c.createLinearGradient(0, -L * .3, 0, L * .3);
    if (type.id === "deme") { body.addColorStop(0, "#2b2b36"); body.addColorStop(.5, "#121218"); body.addColorStop(1, "#2b2b36"); }
    else if (type.id === "kin") { body.addColorStop(0, "#ffe08a"); body.addColorStop(.5, "#f2b43c"); body.addColorStop(1, "#ffe08a"); }
    else { body.addColorStop(0, "#ff7a52"); body.addColorStop(.5, "#e4402a"); body.addColorStop(1, "#ff7a52"); }
    c.fillStyle = body; c.fill();
    if (type.id === "sarasa") {
      c.save(); fishPath(c, L); c.clip(); c.fillStyle = "#fbf3e6";
      spots.forEach(([sx, sy, sr]) => { c.beginPath(); c.ellipse(sx * L, sy * L * .4, sr * L * .7, sr * L * .45, 0, 0, Math.PI * 2); c.fill(); });
      c.restore();
    }
    // dorsal stripe + eyes
    c.strokeStyle = "rgba(255,255,255,.18)"; c.lineWidth = 1.2;
    c.beginPath(); c.moveTo(L * .3, 0); c.lineTo(-L * .2, 0); c.stroke();
    c.fillStyle = type.id === "deme" ? "#d8d8e0" : "#1a1214";
    const ey = type.id === "deme" ? L * .2 : L * .12, ex = type.id === "deme" ? L * .34 : L * .32, er = type.id === "deme" ? L * .05 : L * .035;
    [-1, 1].forEach(s => { c.beginPath(); c.arc(ex, s * ey, er, 0, Math.PI * 2); c.fill(); });
  }

  function drawFish(f, shadow) {
    ctx.save();
    ctx.translate(f.x + (shadow ? 6 : 0), f.y + (shadow ? 9 : 0));
    ctx.rotate(f.a);
    drawFishShape(ctx, f.type, f.type.len, f.phase, f.spots, shadow);
    ctx.restore();
  }

  function drawPoi() {
    if (state === "over") return;
    const { x, y } = poi;
    const under = poi.down;
    const torn = poi.torn > 0;
    // handle
    ctx.save();
    ctx.translate(x, y);
    if (!under) { ctx.fillStyle = "rgba(10,25,55,.3)"; ctx.beginPath(); ctx.ellipse(10, 16, POI_R + 3, POI_R * .9, 0, 0, Math.PI * 2); ctx.fill(); }
    const s = under ? .97 : 1.04;
    ctx.scale(s, s);
    ctx.fillStyle = "#e4483a";
    ctx.save(); ctx.rotate(-Math.PI / 4); ctx.beginPath(); ctx.roundRect(-7, POI_R - 2, 14, 66, 6); ctx.fill(); ctx.restore();
    // paper
    if (!torn) {
      const wet = poi.wet;
      ctx.fillStyle = under ? `rgba(243,236,220,${.30 - wet * .12})` : `rgba(243,236,220,${.82 - wet * .25})`;
      ctx.beginPath(); ctx.arc(0, 0, POI_R, 0, Math.PI * 2); ctx.fill();
      if (poi.health < .45) {
        ctx.strokeStyle = "rgba(80,60,40,.45)"; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(-8, -4); ctx.lineTo(2, 3); ctx.lineTo(10, -2);
        if (poi.health < .25) { ctx.moveTo(2, 3); ctx.lineTo(-2, 14); ctx.moveTo(-8, -4); ctx.lineTo(-16, 6); }
        ctx.stroke();
      }
    } else {
      ctx.fillStyle = "rgba(243,236,220,.75)";
      ctx.beginPath(); ctx.arc(0, 0, POI_R, 0, Math.PI * 2);
      for (let i = 0; i <= 14; i++) { const a = -i / 14 * Math.PI * 2; const r = POI_R * (.55 + (i % 2) * .3); i ? ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r) : ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r); }
      ctx.fill("evenodd");
    }
    // rim
    ctx.strokeStyle = "#e4483a"; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(0, 0, POI_R, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = "rgba(255,255,255,.3)"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(0, 0, POI_R - 1, Math.PI * 1.1, Math.PI * 1.6); ctx.stroke();
    ctx.restore();
  }

  function draw() {
    drawWater();
    fish.forEach(f => drawFish(f, true));
    // fish that the submerged poi sits above are seen through wet paper; draw fish then poi
    fish.forEach(f => drawFish(f, false));
    ctx.strokeStyle = "rgba(220,240,255,.5)"; ctx.lineWidth = 1.5;
    ripples.forEach(r => { ctx.globalAlpha = Math.max(0, r.life); ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2); ctx.stroke(); });
    ctx.globalAlpha = 1;
    drawPoi();
    ctx.fillStyle = "rgba(200,230,255,.8)";
    drops.forEach(p => { ctx.beginPath(); ctx.arc(p.x, p.y, 2.2, 0, Math.PI * 2); ctx.fill(); });
    ctx.textAlign = "center"; ctx.font = '22px "Dela Gothic One", system-ui, sans-serif';
    pops.forEach(p => {
      ctx.globalAlpha = Math.min(1, p.life * 1.5);
      ctx.lineWidth = 4; ctx.strokeStyle = "rgba(13,18,40,.7)"; ctx.strokeText(p.text, p.x, p.y);
      ctx.fillStyle = p.bad ? "#ff8a7a" : p.gold ? "#f2b43c" : "#f3ecdc"; ctx.fillText(p.text, p.x, p.y);
    });
    ctx.globalAlpha = 1;
    // tub rim
    ctx.strokeStyle = "rgba(170,215,255,.35)"; ctx.lineWidth = 10;
    ctx.strokeRect(0, 0, W, H);
  }

  // ---------- hud ----------
  function healthBar() {
    const h = Math.max(0, poi.health), el = $("health");
    el.style.width = (h * 100).toFixed(1) + "%";
    el.style.background = h > .5 ? "var(--paper)" : h > .25 ? "var(--gold)" : "var(--lantern)";
  }
  function renderHud() {
    $("score").value = score; $("best").value = best;
    $("pois").innerHTML = [0, 1, 2].map(i => `<i class="${i >= poisLeft ? "used" : ""}"></i>`).join("");
    healthBar();
    TYPES.forEach(k => { const o = $("n-" + k.id); if (o) o.value = caught[k.id] || 0; });
  }
  function buildBowl() {
    $("bowl").innerHTML = TYPES.map(k => `<div class="kind"><canvas id="ic-${k.id}" width="68" height="44"></canvas><div><b>${k.name}</b><span>${k.pts}点</span></div><output id="n-${k.id}">0</output></div>`).join("");
    TYPES.forEach(k => {
      const c = $("ic-" + k.id).getContext("2d");
      c.translate(38, 22); c.scale(1.5, 1.5);
      drawFishShape(c, k, 22, .6, [[0, -.2, .35], [-.2, .3, .3], [.2, .1, .25]], false);
    });
  }

  const RANKS = [[0, "見習い", "まずは一匹。ゆっくり動かすのがコツ。"], [5, "縁日の常連", "金魚の下にそっと入れて、待つ。"], [15, "すくいの名手", "屋台のおじさんが少し困っています。"], [30, "伝説の職人", "もう出入り禁止かもしれません。"]];
  function endGame() {
    state = "over";
    const n = Object.values(caught).reduce((a, b) => a + b, 0);
    const [, name, note] = RANKS.filter(r => score >= r[0]).pop();
    const isBest = score > best;
    if (isBest) { best = score; try { localStorage.setItem("kingyo-best", String(best)); } catch (e) {} }
    $("finalScore").textContent = score + "点";
    $("rankLabel").textContent = isBest && score > 0 ? "自己ベスト更新!" : `${n}匹すくいました`;
    $("rankName").textContent = name;
    $("endNote").textContent = note;
    $("endScreen").hidden = false;
    renderHud();
    $("againBtn").focus();
  }
  function start() {
    reset(); state = "play";
    $("startScreen").hidden = true; $("endScreen").hidden = true;
    canvas.focus?.();
  }
  $("startBtn").addEventListener("click", start);
  $("againBtn").addEventListener("click", start);

  // ---------- loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    update(dt); draw();
    requestAnimationFrame(frame);
  }

  addEventListener("resize", resize);
  buildBowl(); resize(); reset(); state = "title"; renderHud();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
