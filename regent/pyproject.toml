[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "regent"
version = "0.1.0"
description = "Regent: an operational principal. Observe -> model -> route -> evaluate -> plan -> execute -> verify -> replan."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "pgvector>=0.2",
  "pydantic>=2.6",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "lxml>=5.0",
]

[project.optional-dependencies]
providers = ["anthropic>=0.30", "openai>=1.30"]
browser = ["playwright>=1.44"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["regent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.package-data]
regent = ["api/static/*.html"]

[project.scripts]
regent = "regent.__main__:main"
